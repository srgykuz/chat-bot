services:
  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis_data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 3

  app:
    build: .
    ports:
      - ${APP_PORT:-8000}:8000
    volumes:
      - ./system:/app/system:ro
      - ./system.d:/app/system.d:ro
      - ./personas:/app/personas:ro
      - ./personas.d:/app/personas.d:ro
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    healthcheck:
      test: ["CMD", "python", "-m", "src.cli", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "src.worker"]
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
    volumes:
      - ./system:/app/system:ro
      - ./system.d:/app/system.d:ro
      - ./personas:/app/personas:ro
      - ./personas.d:/app/personas.d:ro
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    depends_on:
      app:
        condition: service_healthy
